name: VS Code Extension

on:
  # vscode-extension is transitional; narrow to [main] once the extension lands on main.
  push:
    branches: [main, vscode-extension]
  pull_request:
    branches: [main, vscode-extension]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # WS2-WS4 will add vscode-smoke (ubuntu + windows matrix) and vscode-e2e
  # per docs/vscode-ci.md. Keep this workflow on the green build/unit layer for now.
  vscode-build:
    runs-on: ubuntu-latest
    env:
      # This workflow does not run Electron; skipping the hosted binary avoids
      # unrelated npm ci failures when Electron's CDN returns 504.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/npm-install

      - name: Build and package VS Code extension
        run: npm run build:vscode

      - name: Typecheck VS Code extension
        run: npm run typecheck --workspace=paseo-vscode

      # The package test script also runs @vscode/test-electron smoke tests,
      # which need a display. Keep CI scoped to unit tests for now.
      - name: Run VS Code unit tests
        run: cd packages/vscode && npx vitest run src/**/*.test.ts --bail=1

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-vsix
          path: packages/vscode/paseo.vsix
